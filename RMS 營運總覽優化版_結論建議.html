<script>
(function(){
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const layer=document.createElement('div');layer.id='rms-global-layer';document.body.append(layer);
let cfg={},focusBefore=null,overflowBefore='',shareData=null;

function close(){layer.innerHTML='';document.body.style.overflow=overflowBefore;focusBefore?.focus?.();focusBefore=null}
function show(html){if(!layer.innerHTML){focusBefore=document.activeElement;overflowBefore=document.body.style.overflow}document.body.style.overflow='hidden';layer.innerHTML=html;setTimeout(()=>layer.querySelector('button,input,textarea,a')?.focus(),20)}
const x=()=>`<button class="rms-close" data-rms="close" aria-label="關閉">${icons.close}</button>`;
const context=()=>cfg.context?cfg.context():{title:'營運總覽',conditions:'示意資料',summary:'目前資料為操作原型示意。'};
function drawer(){const c=context(),dash=cfg.dashboardHref,report=typeof cfg.reportHref==='function'?cfg.reportHref():cfg.reportHref;const items=[['營運總覽',dash,'總計、排名與趨勢','dashboard'],['門市營收一覽表',report,'各店比較、逐日趨勢與表格','report'],['時段分析',dash+'#h-h','營運總覽區塊','hours'],['用餐方式分析',dash+'#h-d','營運總覽區塊','dine'],['會員銷售',dash+'#h-m','營運總覽區塊','member'],['商品銷售',dash+'#h-p','營運總覽區塊','products']];show(`<div class="rms-overlay rms-drawer-wrap" data-rms="scrim"><aside class="rms-drawer" role="dialog" aria-modal="true" aria-label="報表切換"><div class="rms-head"><h2>報表切換</h2>${x()}</div><p class="rms-muted">${E(c.conditions)}</p><input id="rms-nav-search" aria-label="搜尋報表" placeholder="搜尋報表"><nav aria-label="報表">${items.map(([name,url,sub,key])=>`<a class="rms-navlink" href="${E(url)}" data-rms="navigate" ${cfg.page===key?'aria-current="page"':''}>${name}<small>${sub}</small></a>`).join('')}</nav></aside></div>`)}
function ai(){const c=context();show(`<section class="rms-ai" role="dialog" aria-modal="true" aria-label="營運 AI 助理"><header class="rms-ai-header"><span class="rms-ai-label">AI</span><div style="flex:1"><strong>營運 AI 助理</strong><small>${E(c.title)} · ${E(c.conditions)}</small></div>${x()}</header><div class="rms-ai-thread" id="rms-ai-thread" aria-live="polite"><div class="rms-ai-welcome"><h2>想先了解哪個營運重點？</h2><p class="rms-muted">依目前查看的報表與條件，協助整理重點。</p><div class="rms-ai-suggestions">${['目前營業狀況如何？','哪些門市需要留意？','幫我整理一段可分享的重點'].map(s=>`<button data-rms="prompt" data-value="${E(s)}">${s} ↗</button>`).join('')}</div></div></div><div class="rms-ai-compose"><form id="rms-ai-form"><textarea id="rms-ai-input" aria-label="向 AI 提問" placeholder="詢問目前的營運結果…" rows="1" maxlength="500"></textarea><button aria-label="送出問題" type="submit">↑</button></form><p>AI 回覆為原型示意，僅使用畫面中的示意資料。</p></div></section>`)}
function answer(question){const q=question.trim();if(!q)return;const thread=document.getElementById('rms-ai-thread');thread.querySelector('.rms-ai-welcome')?.remove();const c=context();const response=q.includes('分享')?`可分享的重點\n${c.summary}\n\n資料範圍：${c.conditions}。建議分享時一併保留日期、門市與比較期間。`:q.includes('留意')?`${c.summary}\n\n建議先看門市排名與較前期變化，找到差異後，再切換逐日趨勢；零營收門市需另行確認是否營業。`:`${c.summary}\n\n先以總計判斷整體狀況，再用排名比較門市、以折線確認時間變化。以上為目前報表的示意解讀。`;thread.insertAdjacentHTML('beforeend',`<div class="rms-message user">${E(q)}</div><div class="rms-message assistant">${E(response)}</div>`);document.getElementById('rms-ai-input').value='';thread.scrollTop=thread.scrollHeight}
function share(data){shareData=data;const c=context();show(`<div class="rms-overlay" data-rms="scrim"><section class="rms-panel" role="dialog" aria-modal="true" aria-label="分享對象"><div class="rms-head"><h2>分享給誰？</h2>${x()}</div><div class="rms-share-info"><span class="rms-share-icon">${icons.share}</span><div><strong>${E(data.title)}</strong><p>${E(data.conditions||c.conditions)}</p></div></div><div class="rms-targets"><button class="rms-target line" data-rms="target" data-value="LINE"><span class="rms-line-badge">LINE</span>LINE · 選擇分享對象</button><button class="rms-target" data-rms="copy">複製連結</button><button class="rms-target" data-rms="target" data-value="其他 App">其他分享對象</button></div><p class="rms-muted" style="font-size:11px;margin:12px 0 0">分享操作為介面示意，不會實際傳送。</p><details class="rms-preview"><summary>預覽圖卡與加上說明</summary><div class="rms-imagecard"><div class="rms-imagehead"><strong>${E(data.title)}</strong>${E(data.conditions||c.conditions)}</div><div class="rms-imagebody">${data.html||`<p>${E(c.summary)}</p>`}</div><div class="rms-image-note" id="rms-note-out" hidden></div></div><label for="rms-note-in">加一句說明</label><textarea id="rms-note-in" placeholder="例如：請留意本週營收變化" maxlength="300"></textarea></details><details class="rms-preview"><summary>下載與其他選項</summary><div class="rms-downloads"><button data-rms="target" data-value="儲存圖卡">儲存圖卡</button><button data-rms="target" data-value="下載 Excel">下載 Excel</button></div></details></section></div>`);layer.querySelectorAll('.rms-imagebody [id]').forEach(el=>el.removeAttribute('id'));layer.querySelectorAll('.rms-imagebody [data-a]').forEach(el=>el.removeAttribute('data-a'))}
function plot({values,previous,labels,format,selected=null,action=null,actionValues=null,label='趨勢圖'}){const W=600,H=250,L=64,R=18,T=24,B=44;const all=[...values,...(previous||[])].filter(Number.isFinite),min=Math.min(0,...all),max=Math.max(1,...all);const pad=(max-min)*.12,lo=min<0?min-pad:0,hi=max+pad, y=v=>T+(hi-v)/(hi-lo)*(H-T-B),xx=i=>L+i*(W-L-R)/Math.max(1,values.length-1);const path=v=>v.map((v,i)=>`${i?'L':'M'}${xx(i).toFixed(2)},${y(v).toFixed(2)}`).join(' ');return `<svg class="rms-linechart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${E(label)}"><title>${E(label)}</title>${[0,1,2,3].map(i=>{const v=lo+(hi-lo)*i/3;return `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-10}" y="${y(v)+5}" text-anchor="end" fill="var(--muted)" font-size="13">${E(format(v))}</text>`}).join('')}${previous?`<path d="${path(previous)}" fill="none" stroke="#999" stroke-width="2.5" stroke-dasharray="7 6"/>`:''}<path d="${path(values)}" fill="none" stroke="var(--orange)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>${values.map((v,i)=>`<circle cx="${xx(i)}" cy="${y(v)}" r="${i===selected?6:3.5}" fill="${i===selected?'var(--orange-ink)':'var(--orange)'}"/>`).join('')}${labels.map((l,i)=>i===0||i===labels.length-1||labels.length<=7||i%2===0?`<text x="${xx(i)}" y="${H-14}" font-size="13" text-anchor="middle" fill="var(--muted)">${E(l)}</text>`:'').join('')}${action?values.map((v,i)=>`<rect data-a="${E(action)}" data-v="${E(actionValues? actionValues[i]:i)}" x="${xx(i)-18}" y="${T}" width="36" height="${H-T-B}" fill="transparent" role="button" tabindex="0" aria-label="${E(labels[i]+': '+format(v))}" style="cursor:pointer"/>`).join(''):''}</svg>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-rms]');if(!b)return;const a=b.dataset.rms;if(a==='close'||a==='scrim'){if(a==='scrim'&&e.target!==b)return;close()}else if(a==='drawer')drawer();else if(a==='ai')ai();else if(a==='prompt')answer(b.dataset.value);else if(a==='target')notify(`已選擇${b.dataset.value}（操作示意，尚未傳送）`);else if(a==='copy')notify('複製連結操作示意：連結將保留報表與目前條件');else if(a==='navigate'){close()}});
document.addEventListener('input',e=>{if(e.target.id==='rms-nav-search'){const q=e.target.value.trim();layer.querySelectorAll('.rms-navlink').forEach(a=>a.hidden=!a.textContent.includes(q))}if(e.target.id==='rms-note-in'){const o=document.getElementById('rms-note-out');o.textContent=e.target.value;o.hidden=!e.target.value}});
document.addEventListener('submit',e=>{if(e.target.id==='rms-ai-form'){e.preventDefault();answer(document.getElementById('rms-ai-input').value)}});
document.addEventListener('keydown',e=>{if(e.target.matches('svg [role="button"]')&&['Enter',' '].includes(e.key)){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}if(!layer.innerHTML)return;if(e.key==='Escape'){e.preventDefault();close()}if(e.key==='Tab'){const f=[...layer.querySelectorAll('button,a,input,textarea,summary')].filter(el=>!el.hidden&&el.getClientRects().length),first=f[0],last=f.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
let previousScroll=0;window.addEventListener('scroll',()=>{const y=window.scrollY;document.querySelector('.rms-fab')?.classList.toggle('hide',y>previousScroll&&y>120);previousScroll=y},{passive:true});
window.RMSDemo={configure:options=>cfg=options,drawer,ai,share,plot,icons,escape:E,notify};
})();

<script>
(function(){

const pct=(a,b)=>(a/b-1)*100;
const chg=(a,b)=>{const p=pct(a,b);return `<span class="${p<0?'down':'up'}">${p<0?'▼':'▲'} ${Math.abs(p).toFixed(2)}%</span>`};

const DINE=[['立客點內用',16358],['內用',12166],['Uber 外送',5313],['外帶',2930]];

const STORES=[['內湖店',14827,12050,13,'北部'],['台中建和店',9500,8500,9,'中部'],['台南永康店',8240,8101,8,'南部'],['快閃一號店',4200,4500,4,'未分類']];

RMSDemo.configure({page:'dashboard',dashboardHref:DASHBOARD_FILE,reportHref:reportURL,context:()=>({title:'營運總覽',conditions:conditions(),summary:`總營業額 ${n0(K.rev[0])}，比上週同期成長 ${pct(...K.rev).toFixed(1)}%。${Q.scope==='active'?'目前查看內湖店。':'示意門市分布於北、中、南及未分類。'}`})});

}
function member(){
  return `<section class="card" aria-labelledby="h-m">${head('h-m','會員銷售','依營業額')}
   <div class="stack" aria-hidden="true"><i style="width:0%;background:var(--bar)"></i><i style="width:100%;background:var(--bar-soft)"></i></div>
   <div style="display:flex;justify-content:space-between;font-size:13px;margin-top:8px"><span>會員 <b>0%</b>（$0）</span><span>非會員 <b>100%</b>（$${n0(K.rev[0])}）</span></div>
   <p class="empty" style="margin:10px 0 0">今天還沒有會員消費</p>${foot('h-m')}</section>`;
}
function stores(){
 const rows=STORES.filter(r=>Q.scope!=='active'||r[0]==='內湖店'),max=Math.max(1,...rows.map(r=>r[1]));
 const regions=['北部','中部','南部','未分類'];
 const groups=regions.map(region=>{const subset=rows.filter(r=>r[4]===region).sort((a,b)=>b[1]-a[1]);if(!subset.length)return'';const total=subset.reduce((n,r)=>n+r[1],0);return `<details class="overview-region" open><summary><strong>${region}</strong><span>${subset.length} 間門市</span><b>$${n0(total)}</b></summary><div class="overview-ranks">${subset.map((r,i)=>`<div class="overview-rank"><div><span class="rank-index">${i+1}</span><strong>${r[0]}</strong><b>$${n0(r[1])}</b></div><div class="overview-track"><i style="width:${r[1]/max*100}%"></i></div><small>${chg(r[1],r[2])} · ${n0(r[3])} 筆</small></div>`).join('')}</div></details>`}).join('');
 return `<section class="card" aria-labelledby="h-s">${head('h-s','門市營業額排名','比較門市高低 · 依區域分段，可展開或收合')}<div class="overview-region-list">${groups}</div>${foot('h-s')}</section>`;
}

function products(){
  const top=S.prod==='top';
  const rows=top?TOP.map((p,i)=>[i+1,p[0],p[1]]):LOW.map(p=>[p[2],p[0],p[1]]);
  return `<section class="card span" aria-labelledby="h-p">${head('h-p','商品銷售額',`共 46 項商品`)}
   <div class="seg" role="group" aria-label="排名方向"><button data-a="prod" data-v="top" aria-pressed="${top}">賣最好的 10 項</button><button data-a="prod" data-v="low" aria-pressed="${!top}">賣最少的 10 項</button></div>
   <div>${rows.map(r=>`<div class="rk"><span class="r">${r[0]}</span><span class="nm">${r[1]}</span><span class="amt">$${n0(r[2])}</span></div>`).join('')}</div>
   ${top?'':`<p class="note">由少到多排列；同金額的商品並列同一名次。</p><div class="empty" style="margin-top:10px"><span style="flex:1">${ZERO.length} 項今天沒有賣出</span><button class="lnk" data-a="zero" aria-expanded="${S.showZero}">${S.showZero?'收合':'看是哪幾項'}</button></div>${S.showZero?`<p class="note">${ZERO.join('、')}</p>`:''}`}${foot('h-p')}</section>`;
}
function changes(){
  const C=[['條件區','灰色框換兩行；「更新時間」「圖片下載」「數據同步」佔一整列','直角條件列固定在上方，日期優先、比較基期寫在列內；更新時間與自動同步縮成一行小字，下載移到右上角分享'],
   ['總計指標','5 張大卡各佔一整列，要捲兩個畫面多才看完','營業額放大置頂，其餘 4 項兩欄排列，一個畫面看完；漲跌用 ▲▼ 加文字，不只靠顏色'],
   ['用餐方式','環圈圖 4 塊，右側標籤被切掉，圖例只有金額沒有占比','由高到低的橫條，同時寫占比與金額'],
   ['時段分析','15、16 點缺漏時軸被壓縮；紅色虛線 4595.8 沒說明、被切掉；下方縮放滑桿用不到','保留每個時段位置、標出尖峰；虛線標成「平均 $4,596」；點長條直接看數字，拿掉滑桿'],
   ['會員銷售','100% 非會員的整圈環圈圖，佔一整張卡卻沒有資訊','一條比例條加一句「今天還沒有會員消費」'],
   ['門市排名','只有 1 間有營業額時，前 10 名和後 10 名列出同一間店','少於 10 間全部列出一次；沒有營業額的店收成一行'],
   ['商品排名','名稱被「…」截斷；後 10 名由 46 名倒排，3 項金額為 0 混在一起','名稱完整換行；用切換看「賣最好／賣最少」，由少到多；未賣出的商品另外收合'],
   ['每張卡片','只能整頁下載圖片','右上角直接分享這張卡片（圖卡帶條件、可加說明）；底部「看完整報表 ›」進入對應報表，條件一起帶過去'],
   ['浮動助理','頭像固定在右下角，蓋住表格數字','縮小成 48px，往下捲時自動藏起來，往上捲再出現']];
  return `<section class="card span" aria-labelledby="h-c"><details class="changes"><summary id="h-c">這版改了什麼（對照原版）</summary>
   <table class="ctab"><thead><tr><th style="width:18%">區塊</th><th style="width:38%">原版問題</th><th>這版做法</th></tr></thead><tbody>${C.map(c=>`<tr><td><b>${c[0]}</b></td><td>${c[1]}</td><td>${c[2]}</td></tr>`).join('')}</tbody></table></details></section>`;
}
const main=document.getElementById('main'), layer=document.getElementById('layer'), toastEl=document.getElementById('toast');
function render(){main.innerHTML=kpi()+stores()+hours()+dine()+member()+products()+`<p class="foot span">結論建議版 · 總計、用餐方式、時段與商品前 10 名沿用原版數字，其餘為示意資料。</p>`;document.getElementById('c-date').textContent=dates[Q.date];document.getElementById('c-rest').textContent=`示意品牌｜${scopeLabel()}｜比${comparisons[Q.compare]}`;document.querySelector('.cond').setAttribute('aria-label','修改查詢條件：'+conditions())}

let tt;function toast(m){toastEl.textContent=m;toastEl.hidden=false;clearTimeout(tt);tt=setTimeout(()=>toastEl.hidden=true,2200)}
function sheet(html){layer.innerHTML=`<div class="overlay" data-a="close"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`}
const X=`<button class="ib" data-a="close" aria-label="關閉" style="width:40px;height:40px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`;
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
 if(a==='close'){if(b.classList.contains('overlay')&&e.target!==b)return;layer.innerHTML='';return}
 if(a==='hour')S.hour=+b.dataset.v;
 else if(a==='prod')S.prod=b.dataset.v;
 else if(a==='zero')S.showZero=!S.showZero;
 else if(a==='stores')S.showStores=!S.showStores;
 else if(a==='sync'){S.sync=!S.sync;b.setAttribute('aria-checked',S.sync);document.getElementById('syncl').textContent=S.sync?'每 10 分鐘自動更新':'自動更新已關閉';return}
 else if(a==='refresh'){document.getElementById('upd').textContent='剛剛更新';toast('示意資料已更新');return}
 else if(a==='share'){shareOverview(b.dataset.k,b.dataset.v);return}
 else if(a==='sharepage'){RMSDemo.share({title:'營運總覽',conditions:conditions(),html:kpi()+stores()});return}
 else if(a==='cond'){queryOverview();return}
 else if(a==='applycond'){Q={date:document.getElementById('q-d').value,scope:document.getElementById('q-s').value,compare:document.getElementById('q-c').value};try{localStorage.setItem('rms-overview-conclusions-v1',JSON.stringify(Q))}catch(e){}layer.innerHTML='';render();toast('搜尋完成，條件已收合置頂（資料為示意）');return}
 else if(a==='ai'){RMSDemo.ai();return}
 else if(a==='todo'){sheet(`<h3>${RMSDemo.escape(b.dataset.v)}${X}</h3><p class="note">本原型先呈現此報表的總覽區塊，可由側邊「報表切換」快速查看。</p><button class="primary" data-a="close">返回總覽</button>`);return}
 else if(a==='reportlink'){try{sessionStorage.setItem('rms-overview-scroll',String(window.scrollY))}catch(e){}return}
 else if(a==='act'){layer.innerHTML='';toast(b.dataset.v);return}
 else return;
 render();
});

document.addEventListener('keydown',e=>{if(e.key==='Escape')layer.innerHTML=''});
document.addEventListener('input',e=>{if(e.target.id==='ni'){const o=document.getElementById('nt');o.textContent=e.target.value;o.hidden=!e.target.value}});
let lastY=0;const fab=document.getElementById('fab');
window.addEventListener('scroll',()=>{const y=window.scrollY;fab.classList.toggle('hide',y>lastY&&y>120);lastY=y},{passive:true});
render();
if(location.search.includes('restore=1')&&!location.hash){try{requestAnimationFrame(()=>window.scrollTo(0,Number(sessionStorage.getItem('rms-overview-scroll')||0)))}catch(e){}}
})();
</script>

</body></html>
